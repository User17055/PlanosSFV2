# Example only: replace server_name, release path and PHP-FPM socket.
server {
    listen 80;
    server_name planos.seudominio.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name planos.seudominio.com.br;
    root /var/www/saofrancisco/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 11m;

    ssl_certificate /etc/letsencrypt/live/planos.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planos.seudominio.com.br/privkey.pem;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # Fontes, CSS, JS e imagens em cache: sem isso cada página baixa as fontes de novo e o texto "pula".
    # add_header dentro do bloco desliga a herança do servidor, por isso os cabeçalhos de segurança se repetem.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(sqlite|sql|env|log|bak)$ { deny all; }
}
