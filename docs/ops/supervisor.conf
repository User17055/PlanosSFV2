; Example only. Use retry_after > worker timeout in config/queue.php / env.
[program:sf-vindi]
command=/usr/bin/php /var/www/saofrancisco/current/artisan queue:work --queue=vindi --sleep=3 --tries=5 --timeout=120 --max-time=3600
directory=/var/www/saofrancisco/current
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=150
redirect_stderr=true
stdout_logfile=/var/log/saofrancisco-vindi.log

