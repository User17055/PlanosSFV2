name: Tests

on:
  push:
    branches:
      - main
      - gui
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gestao:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: Gestão PHP ${{ matrix.php }} (SQLite)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: vendor/bin/phpunit

  mysql:
    runs-on: ubuntu-latest

    name: Gestão PHP 8.4 (MySQL 8.0, igual à VPS)

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: planos_test
          MYSQL_USER: planos
          MYSQL_PASSWORD: planos
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: planos_test
      DB_USERNAME: planos
      DB_PASSWORD: planos

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, pcntl, pdo, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # Com o log binário ligado (padrão do MySQL 8.0), só quem tem SUPER cria trigger; as travas do V2 são
      # triggers. Em produção vale o mesmo: ver docs/OPERACAO.md.
      - name: Allow trigger creation by the database owner
        run: mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"

      - name: Execute tests
        run: vendor/bin/phpunit

      # Banco limpo, migrado pelo dono (a suíte deixa linhas gravadas), e o usuário da aplicação.
      - name: Create the application user (deploy/app-grants.sh)
        env:
          PLANOS_DB: planos_test
          PLANOS_APP_HOST: '%'
          MYSQL: mysql -h 127.0.0.1 -uroot -proot
        run: |
          php artisan migrate:fresh --force
          $MYSQL -e "CREATE USER 'sf_application'@'%' IDENTIFIED BY 'sf_application'"
          bash deploy/app-grants.sh

      - name: Application user permissions
        env:
          DB_USERNAME: sf_application
          DB_PASSWORD: sf_application
          PLANOS_CHECK_APP_GRANTS: 1
        run: |
          vendor/bin/phpunit --colors=never --filter AppDatabaseUserTest | tee app-user.txt
          grep -Eq "^OK \(3 tests" app-user.txt

      - name: Control - the same test fails with the database owner
        env:
          PLANOS_CHECK_APP_GRANTS: 1
        run: |
          php artisan migrate:fresh --force
          if vendor/bin/phpunit --colors=never --filter AppDatabaseUserTest > control.txt 2>&1; then
            cat control.txt
            echo "Passou com o dono do banco: o teste não distingue as permissões."
            exit 1
          fi
          cat control.txt
          grep -q "deveria ser negado" control.txt

  deploy-scripts:
    runs-on: ubuntu-latest

    name: Scripts de deploy (shellcheck)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck deploy/*.sh

  institucional:
    runs-on: ubuntu-latest

    name: Institucional PHP 8.5

    defaults:
      run:
        working-directory: institucional

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, pdo, pdo_sqlite, sqlite, xml, tokenizer
          coverage: none

      - name: Install Composer dependencies
        working-directory: institucional/public_html
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Execute tests
        run: public_html/vendor/phpunit/phpunit/phpunit -c tests/phpunit.xml
